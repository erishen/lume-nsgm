# docker compose 一键构建并运行 lume-nsgm 生成的全栈应用（PayPal 支付变体）。
#
# 用法（在 lume-nsgm/ 目录下）：
#   docker compose up --build      # 首次构建（编译 lume-core + 重新生成 + 构建前端）
#   docker compose up -d           # 后台运行
#   docker compose down            # 停止并移除容器（数据卷 nsgm-paypal-data 保留）
#
# 构建上下文是 lume-nsgm 的父目录（work/lume），因为 Dockerfile 需要
# 同时拿到 lume-core 源码与生成器源码。
#
# 访问（宿主端口默认 18082，>10000；可用 DOCKER_PORT 环境变量覆盖）：
#   首页 / SSR 页面 ： http://localhost:18082/
#   React SPA       ： http://localhost:18082/spa/
#   REST API        ： http://localhost:18082/api/<module>
#
# 本服务即 PayPal 支付变体（构建参数 NSGM_CONFIG=example-paypal.json）：
# 镜像内跑带 pay 路由的生成工程。支付凭据经 environment 从宿主 .env 注入
# （${PAYPAL_KEY} 等），不进镜像层；env 名避开 SECRET/TOKEN 等词根
# （lume env() 会掩码这类名字）。普通 CRUD 变体见 README「Docker 部署」。

services:
  paypal:
    build:
      context: ..
      dockerfile: lume-nsgm/Dockerfile
      args:
        NSGM_CONFIG: example-paypal.json
    image: lume-nsgm-app:paypal
    container_name: lume-nsgm-paypal
    ports:
      - "${DOCKER_PORT:-18082}:18081"
    environment:
      # 生成工程从 env 读取 server 配置；容器内固定 18081 / 0.0.0.0 / 单 worker
      - PORT=18081
      - HOST=0.0.0.0
      - WORKERS=1
      # SQLite 数据文件（命名卷 nsgm-paypal-data 挂 /data）
      - NSGM_DB=/data/nsgm-paypal.db
      # PayPal 凭据（值从宿主 .env 注入；client_secret 的 env 名避开掩码词根）
      - PAYPAL_CLIENT_ID=${PAYPAL_CLIENT_ID:-}
      - PAYPAL_KEY=${PAYPAL_KEY:-}
      # approve 后跳回本容器的基址（生成工程拼 /api/pay/return）
      - PAYPAL_RETURN_URL=${PAYPAL_RETURN_URL:-http://127.0.0.1:18082}
      # 不设 PAY_GATEWAY：缺省走真实沙箱 api-m.sandbox.paypal.com
    volumes:
      - nsgm-paypal-data:/data
    # 与线上裸跑实例一致：不自动重启（沙箱实例，手动管控）
    restart: "no"
    # 探针：任何构建配置都有首页路由，统一探 /
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:$$PORT/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  nsgm-paypal-data:
    driver: local
    # 显式卷名（compose 默认会加项目前缀 lume-nsgm_）：与既有线上数据卷
    # nsgm-paypal-data 对齐；新克隆者首次 up 时会自动创建同名卷
    name: nsgm-paypal-data
